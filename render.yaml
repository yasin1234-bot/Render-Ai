services:
  - type: web
    name: ping-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SELF_PING_INTERVAL_MINUTES
        value: 5
      - key: SECRET_KEY
        generateValue: true
